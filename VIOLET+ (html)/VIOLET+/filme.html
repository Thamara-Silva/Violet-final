<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <link

  />
<!-- Carrega o arquivo JavaScript responsável pelas ações da página. -->

  <link rel="stylesheet" href="style_responsivo.css" />
  <link rel="stylesheet" href="filme.css" />
